[project]
name = "orrery"
version = "0.1.0"
description = "Prompt DSL that records every pick, an LLM wildcard manager, and a MiniMax H3 compiler"
license = "MIT"
authors = [
    { name = "pyros-projects", email = "pyros.sd.models@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0.3",
]

[project.scripts]
orrery = "orrery.cli:main"

[build-system]
requires = ["uv_build>=0.9.15,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "aiohttp>=3.11",
    "av>=18.1.0",
    "numpy>=2.5.3",
    "pillow>=12.3.0",
    "pytest>=9.1.1",
    "pytest-xdist>=3.8.0",
    "ruff>=0.16.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100

[project.optional-dependencies]
local = ["transformers>=5.9", "torch>=2.12", "accelerate>=1.14"]
serve = ["aiohttp>=3.11", "av>=18.1.0", "numpy>=2.5.3", "pillow>=12.3.0"]  # every route outside ComfyUI

[tool.uv.sources]
torch = [{ index = "pytorch-cu130" }]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
